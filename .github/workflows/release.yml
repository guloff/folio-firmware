name: Release x4pro

# Publish a GitHub release (tag vX.Y.Z matching [folio] version in platformio.ini);
# this workflow builds the image and attaches folio-<version>-x4pro.bin.
# Signing: if the repository secret FOLIO_SIGNING_KEY (ed25519 private key, PEM) is set,
# the .bin.sig is produced here. Otherwise sign locally with
# tools/inklink/sign_release.sh <tag> — readers refuse unsigned OTA images.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          submodules: recursive

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          configured="$(sed -n '/^\[folio\]/,/^\[/s/^version = //p' platformio.ini | head -n1)"
          echo "tag=$version ini=$configured"
          test "$version" = "$configured"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Build x4pro
        run: pio run -e x4pro-gh_release -j2

      - name: Prepare asset
        id: asset
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          asset="folio-${version}-x4pro.bin"
          cp .pio/build/x4pro-gh_release/firmware.bin "$asset"
          sha256sum "$asset" | tee "$asset.sha256"
          echo "name=$asset" >> "$GITHUB_OUTPUT"

      - name: Sign asset
        env:
          FOLIO_SIGNING_KEY: ${{ secrets.FOLIO_SIGNING_KEY }}
          ASSET: ${{ steps.asset.outputs.name }}
        run: |
          if [ -z "$FOLIO_SIGNING_KEY" ]; then
            echo "::warning::FOLIO_SIGNING_KEY is not set: release is unsigned, run tools/inklink/sign_release.sh locally"
            exit 0
          fi
          umask 077
          printf '%s\n' "$FOLIO_SIGNING_KEY" > key.pem
          FOLIO_SIGNING_KEY_FILE=key.pem tools/inklink/sign_firmware.sh "$ASSET"
          rm -f key.pem
          test "$(stat -c %s "$ASSET.sig")" -eq 64

      - name: Attach assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ASSET: ${{ steps.asset.outputs.name }}
        run: |
          files="$ASSET $ASSET.sha256"
          [ -f "$ASSET.sig" ] && files="$files $ASSET.sig"
          gh release upload "$RELEASE_TAG" $files --repo "$GITHUB_REPOSITORY" --clobber
